{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<p class="muted">HTTP {{ status }}</p>
<p>{{ message }}</p>
{% if problems %}
<div class="table-wrap">
  <table>
    <thead><tr><th scope="col">Field</th><th scope="col">Code</th><th scope="col">Message</th></tr></thead>
    <tbody>
      {% for p in problems %}
      <tr><td><code>{{ p.field }}</code></td><td>{{ p.code }}</td><td>{{ p.message }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endif %}
<p><a href="{{ url_for('views.clients') }}">Back to clients</a></p>
{% endblock %}
